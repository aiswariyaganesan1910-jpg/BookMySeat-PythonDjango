<!DOCTYPE html>

<html>

<head>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f4f4f4;

            padding: 20px;

        }

        .container {

            background: white;

            padding: 30px;

            border-radius: 10px;

            max-width: 600px;

            margin: auto;

            box-shadow: 0 0 10px rgba(0,0,0,0.1);

        }

        h1 {

            color: #2563eb;

        }

        .details {

            margin-top: 20px;

        }

        .details p {

            font-size: 16px;

            margin: 10px 0;

        }

        .footer {

            margin-top: 30px;

            color: gray;

            font-size: 14px;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>

        Booking Confirmed 🎉

    </h1>

    <p>

        Thank you for booking with BookMySeat.

    </p>

    <div class="details">

        <p>

            <strong>Movie:</strong>
            {{ movie.movie_name }}

        </p>

        <p>

            <strong>Theater:</strong>
            {{ theater.name }}

        </p>

        <p>

            <strong>Show Time:</strong>
            {{ theater.time }}

        </p>

        <p>

            <strong>Seats:</strong>
            {{ seats }}

        </p>

        <p>

            <strong>Payment ID:</strong>
            {{ payment_id }}

        </p>

    </div>

    <div class="footer">

        Enjoy your movie experience 🍿

    </div>

</div>

</body>

</html>
