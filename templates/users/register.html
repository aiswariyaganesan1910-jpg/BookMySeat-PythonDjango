{% extends 'users/basic.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h2>Register</h2>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-primary">

                            Register

                        </button>

                    </form>

                    <hr>

                    <a href="{% url 'login' %}">

                        Login here

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
