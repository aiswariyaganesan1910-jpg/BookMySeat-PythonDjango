{% extends "users/basic.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h2>Enter New Password</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success">

                Reset Password

            </button>

        </form>

    </div>

</div>

{% endblock %}
