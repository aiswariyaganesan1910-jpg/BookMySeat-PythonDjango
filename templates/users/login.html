{% extends 'users/basic.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h2>Login</h2>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-success">

                            Login

                        </button>

                    </form>

                    <hr>

                    <a href="{% url 'register' %}">

                        Create new account

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
