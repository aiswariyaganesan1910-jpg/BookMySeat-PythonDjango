{% extends "users/basic.html" %}

{% block content %}

<!-- Carousel -->

<div id="carouselExampleIndicators"
     class="carousel slide"
     data-ride="carousel">

    <ol class="carousel-indicators">

        <li data-target="#carouselExampleIndicators"
            data-slide-to="0"
            class="active"></li>

        <li data-target="#carouselExampleIndicators"
            data-slide-to="1"></li>

        <li data-target="#carouselExampleIndicators"
            data-slide-to="2"></li>

    </ol>

    <div class="carousel-inner">

        <div class="carousel-item active">

            <img
                class="d-block w-100"
                src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop"
                style="height:450px; object-fit:cover;"
            >

        </div>

        <div class="carousel-item">

            <img
                class="d-block w-100"
                src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop"
                style="height:450px; object-fit:cover;"
            >

        </div>

        <div class="carousel-item">

            <img
                class="d-block w-100"
                src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop"
                style="height:450px; object-fit:cover;"
            >

        </div>

    </div>

</div>


<!-- Recommended Movies -->

<div class="container mt-5">

    <h1 class="mb-4">

        Recommended Movies

    </h1>

    <div class="row">

        {% for movie in movies %}

        <div class="col-md-3 mb-4">

            <div class="card shadow h-100">

                <img
                    src="{{ movie.movie_image.url }}"
                    class="card-img-top"
                    style="height:350px; object-fit:cover;"
                >

                <div class="card-body">

                    <h4>

                        {{ movie.movie_name }}

                    </h4>

                    <p>

                        🎭 Cast:
                        {{ movie.cast }}

                    </p>

                    <a
                        href="{% url 'theater_list' movie.id %}"
                        class="btn btn-primary w-100"
                    >

                        View Theaters

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>


<!-- Premiere Section -->
